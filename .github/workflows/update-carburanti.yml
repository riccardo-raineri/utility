# Aggiorna quotidianamente i dati dei prezzi carburante (fonte: MIMIT)
#
# Cosa fa:
#   1. Scarica ed esegue scripts/update_carburanti.py, che scarica i CSV
#      del MIMIT e produce i JSON dentro utility/data/carburanti/
#   2. Se qualcosa è cambiato rispetto all'ultimo commit, fa commit + push
#      direttamente sul branch di pubblicazione (di solito "main").
#
# Se il tuo sito è pubblicato da un branch diverso da "main" (es. "gh-pages"),
# o se il repo non è alla root del sito, aggiorna i percorsi qui sotto e
# la variabile OUTPUT_DIR dentro update_carburanti.py.

name: Aggiorna prezzi carburanti

on:
  schedule:
    # Ogni giorno alle 07:00 ora italiana (le 06:00 UTC in inverno,
    # le 05:00 UTC in estate — GitHub Actions usa sempre l'UTC, quindi
    # l'orario locale slitta di un'ora tra inverno ed estate: non è un
    # problema per questo caso d'uso, il dato del MIMIT è comunque
    # quello delle 8 del mattino del giorno precedente).
    - cron: "0 6 * * *"
  # Permette di lanciare l'aggiornamento manualmente da GitHub
  # (tab "Actions" del repository -> questo workflow -> "Run workflow").
  workflow_dispatch: {}

# Il job deve poter fare push sul repository.
permissions:
  contents: write

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegui script di aggiornamento
        run: python scripts/update_carburanti.py

      - name: Commit e push se ci sono cambiamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add utility/data/carburanti
          # "git diff --cached --quiet" ritorna 0 (successo) se non ci sono
          # cambiamenti: in quel caso saltiamo il commit invece di fallire.
          if git diff --cached --quiet; then
            echo "Nessun cambiamento nei dati, salto il commit."
          else
            git commit -m "Aggiorna prezzi carburanti $(date -u +%Y-%m-%d)"
            git push
          fi